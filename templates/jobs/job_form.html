{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit Job{% else %}Create Job{% endif %}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>{% if form.instance.pk %}Edit Job{% else %}Create Job{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}
