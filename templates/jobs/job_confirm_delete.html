{% extends 'base.html' %}

{% block title %}Delete Job{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div class="mb-3">
                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2.5rem;"></i>
                    </div>
                    <h2 class="mb-3 text-danger">Delete Job?</h2>
                    <p>Are you sure you want to <strong>permanently delete</strong> "<span class="text-primary">{{ object.title }}</span>"?</p>
                    <form method="post" class="mt-4 d-flex flex-column flex-sm-row justify-content-center gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
                        <a href="{% url 'job_detail' object.id %}" class="btn btn-secondary btn-lg">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
