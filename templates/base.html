<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Job Portal{% endblock %}</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
</head>

<body>
  {% if user.is_authenticated %}
    <div style="position: absolute; top: 16px; right: 32px; z-index: 10;">
      <div class="dropdown">
        <button class="btn btn-light dropdown-toggle" type="button" id="notifDropdown" data-toggle="dropdown"
          aria-haspopup="true" aria-expanded="false">
          🔔 Notifications ({{ user_notifications|length }})
        </button>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="notifDropdown" style="min-width: 350px;">
          {% if user_notifications %}
            {% for notif in user_notifications %}
              <a class="dropdown-item" href="{{ notif.link|default:'#' }}">
                {{ notif.message|truncatechars:50 }}<br>
                <small class="text-muted">{{ notif.created_at|date:"M d, H:i" }}</small>
              </a>
            {% endfor %}
          {% else %}
            <span class="dropdown-item-text text-muted">No new notifications.</span>
          {% endif %}
        </div>
      </div>
    </div>
  {% endif %}
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
